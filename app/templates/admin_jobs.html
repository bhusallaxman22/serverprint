{% extends "base.html" %}
{% block title %} · Print Jobs{% endblock %}
{% block content %}
<section class="card">
  <h2>Print-job administration</h2>
  <form id="job-filter-form" class="filters" hx-get="/ui/admin/jobs/list" hx-target="#admin-job-rows" hx-swap="innerHTML" hx-trigger="change from:select, keyup changed delay:350ms from:input">
    <select name="status" aria-label="Status filter">
      {% for option in status_options %}
      <option value="{{ option }}" {% if status_filter == option %}selected{% endif %}>{{ option|title }}</option>
      {% endfor %}
    </select>
    <input type="search" name="owner" value="{{ owner_filter }}" placeholder="Filter by owner" aria-label="Owner filter" />
    <input type="search" name="search" value="{{ search_query }}" placeholder="Search file or UUID" aria-label="Search jobs" />
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Job</th><th>Owner</th><th>Status</th><th>Requested</th><th>Action</th></tr></thead>
      <tbody id="admin-job-rows">{% include 'partials/admin_job_rows.html' %}</tbody>
    </table>
  </div>
</section>
{% endblock %}
