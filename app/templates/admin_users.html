{% extends "base.html" %}
{% block title %} · User Administration{% endblock %}
{% block content %}
<section class="card">
  <h2>User administration</h2>
  <form id="user-filter-form" class="filters" hx-get="/ui/admin/users/list" hx-target="#admin-user-rows" hx-swap="innerHTML" hx-trigger="change from:select, keyup changed delay:350ms from:input">
    <input type="search" name="search" value="{{ search_query }}" placeholder="Search username" aria-label="Search users" />
    <select name="role" aria-label="Role filter">
      <option value="all" {% if role_filter == 'all' %}selected{% endif %}>All roles</option>
      <option value="admin" {% if role_filter == 'admin' %}selected{% endif %}>Admins</option>
      <option value="user" {% if role_filter == 'user' %}selected{% endif %}>Users</option>
    </select>
    <label class="inline-check"><input type="checkbox" name="show_inactive" value="true" {% if show_inactive %}checked{% endif %}/>Include inactive</label>
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr><th>User</th><th>Role</th><th>Limits</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="admin-user-rows">{% include 'partials/admin_user_rows.html' %}</tbody>
    </table>
  </div>
</section>
{% endblock %}
