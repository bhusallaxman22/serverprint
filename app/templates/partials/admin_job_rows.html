{% for job in jobs %}
<tr>
  <td>{{ job.job_uuid }}<br /><small>{{ job.document_name }} · {{ job.pages }} pages × {{ job.copies }}</small></td>
  <td>{{ job.owner_username }}</td>
  <td><span class="badge {{ job.status.value }}">{{ job.status.value|title }}</span>{% if job.reason %}<br /><small>{{ job.reason }}</small>{% endif %}</td>
  <td>{{ job.requested_at.strftime('%Y-%m-%d %H:%M') }}</td>
  <td>
    <div class="actions-inline">
      <form hx-post="/ui/admin/jobs/{{ job.job_uuid }}/action" hx-target="#admin-job-rows" hx-swap="innerHTML" onsubmit="return confirm('Approve this print job?')">
        <input type="hidden" name="status" value="{{ status_filter }}" />
        <input type="hidden" name="owner" value="{{ owner_filter }}" />
        <input type="hidden" name="search" value="{{ search_query }}" />
        <input type="hidden" name="action" value="approve" />
        <button class="button xs success" type="submit" {% if job.status.value != 'pending' %}disabled{% endif %}>Approve</button>
      </form>
      <form hx-post="/ui/admin/jobs/{{ job.job_uuid }}/action" hx-target="#admin-job-rows" hx-swap="innerHTML" onsubmit="return confirm('Reject this print job?')">
        <input type="hidden" name="status" value="{{ status_filter }}" />
        <input type="hidden" name="owner" value="{{ owner_filter }}" />
        <input type="hidden" name="search" value="{{ search_query }}" />
        <input type="hidden" name="action" value="reject" />
        <input type="hidden" name="reason" value="Rejected by administrator." />
        <button class="button xs danger" type="submit" {% if job.status.value not in ['pending', 'queued', 'approved'] %}disabled{% endif %}>Reject</button>
      </form>
      <form hx-post="/ui/admin/jobs/{{ job.job_uuid }}/action" hx-target="#admin-job-rows" hx-swap="innerHTML" onsubmit="return confirm('Cancel this print job?')">
        <input type="hidden" name="status" value="{{ status_filter }}" />
        <input type="hidden" name="owner" value="{{ owner_filter }}" />
        <input type="hidden" name="search" value="{{ search_query }}" />
        <input type="hidden" name="action" value="cancel" />
        <button class="button xs" type="submit" {% if job.status.value in ['completed', 'cancelled'] %}disabled{% endif %}>Cancel</button>
      </form>
      <form hx-post="/ui/admin/jobs/{{ job.job_uuid }}/action" hx-target="#admin-job-rows" hx-swap="innerHTML" onsubmit="return confirm('Retry this print job?')">
        <input type="hidden" name="status" value="{{ status_filter }}" />
        <input type="hidden" name="owner" value="{{ owner_filter }}" />
        <input type="hidden" name="search" value="{{ search_query }}" />
        <input type="hidden" name="action" value="retry" />
        <button class="button xs" type="submit" {% if job.status.value not in ['failed', 'rejected', 'cancelled'] %}disabled{% endif %}>Retry</button>
      </form>
    </div>
  </td>
</tr>
{% else %}
<tr><td colspan="5" class="muted">No jobs found.</td></tr>
{% endfor %}
