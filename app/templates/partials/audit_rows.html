{% for row in rows %}
<tr class="align-top md:border-b md:border-canvas-border/80">
  <td class="px-2 py-3 text-ink-muted md:whitespace-nowrap" data-label="When">{{ row.created_at.strftime('%Y-%m-%d %H:%M:%S') }}</td>
  <td class="px-2 py-3 text-ink" data-label="Actor">{{ row.actor }}</td>
  <td class="px-2 py-3" data-label="Action"><span class="badge-status approved">{{ row.action }}</span></td>
  <td class="px-2 py-3 break-words text-ink" data-label="Target">{{ row.target }}</td>
  <td class="px-2 py-3 break-words text-ink-muted" data-label="Detail">{{ row.detail }}</td>
</tr>
{% else %}
<tr>
  <td colspan="5" class="px-2 py-6 text-sm text-ink-muted">No audit entries match the filters.</td>
</tr>
{% endfor %}
