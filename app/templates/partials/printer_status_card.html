<div class="flex max-w-full items-center gap-2 rounded-lg border border-canvas-border bg-canvas-raised/90 px-2.5 py-1.5 sm:gap-2.5 sm:px-3 sm:py-2">
  <span
    class="inline-block h-2.5 w-2.5 shrink-0 rounded-full {% if printer.health == 'online' %}bg-emerald-400{% elif printer.health == 'warning' %}bg-amber-400{% else %}bg-rose-400{% endif %}"
    aria-hidden="true"
  ></span>
  <div class="min-w-0">
    <p class="truncate text-xs font-medium text-ink sm:text-sm">{{ printer.name }}</p>
    <p class="truncate text-[0.65rem] text-ink-muted sm:text-xs">{{ printer.health|title }}<span class="hidden sm:inline"> · Queue {{ printer.queue_depth }}</span></p>
  </div>
</div>
