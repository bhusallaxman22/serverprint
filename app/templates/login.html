{% extends "base.html" %}
{% block title %} · Login{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Welcome to PrintDrop</h2>
  <p class="muted">Sign in to submit and monitor print jobs securely.</p>
  <form action="/login" method="post" class="stack-form" autocomplete="on">
    <label>
      Username
      <input name="username" required minlength="3" maxlength="64" autofocus />
    </label>
    <label>
      Password
      <input name="password" type="password" required minlength="4" />
    </label>
    <button class="button primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
