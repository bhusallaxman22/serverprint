services:
  printdrop:
    image: ${PRINTDROP_IMAGE:-ghcr.io/OWNER/printdrop:latest}
    container_name: printdrop
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PRINTDROP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      PRINT_API_KEY: ${PRINT_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PRINTER_NAME: ${PRINTER_NAME}
      CUPS_SERVER: ${CUPS_SERVER:-cups}
      PORT: "8000"
      RUN_SCHEDULER: ${RUN_SCHEDULER:-false}
      TZ: ${TZ:-UTC}
      FORCE_PASSWORD_CHANGE_DEFAULT: ${FORCE_PASSWORD_CHANGE_DEFAULT:-true}
      RETAIN_SUCCESSFUL_UPLOADS: ${RETAIN_SUCCESSFUL_UPLOADS:-false}
      PRINT_STATUS_POLL_SECONDS: ${PRINT_STATUS_POLL_SECONDS:-30}
      FAILED_FILE_RETENTION_HOURS: ${FAILED_FILE_RETENTION_HOURS:-72}
      PENDING_FILE_RETENTION_DAYS: ${PENDING_FILE_RETENTION_DAYS:-14}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      # false for direct HTTP (:8000). Set true only when the browser reaches PrintDrop over HTTPS.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-12}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-30}
      UPLOADS_ROOT: /data/uploads
      TMP_ROOT: /data/tmp
      NODE_ENV: production
    volumes:
      - printdrop_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Optional dedicated scheduler/worker process. Enable with:
  # docker compose --profile worker up -d
  printdrop-worker:
    image: ${PRINTDROP_IMAGE:-ghcr.io/OWNER/printdrop:latest}
    container_name: printdrop-worker
    restart: unless-stopped
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      PRINT_API_KEY: ${PRINT_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PRINTER_NAME: ${PRINTER_NAME}
      CUPS_SERVER: ${CUPS_SERVER:-cups}
      RUN_SCHEDULER: "true"
      RUN_AS_WORKER: "true"
      TZ: ${TZ:-UTC}
      UPLOADS_ROOT: /data/uploads
      TMP_ROOT: /data/tmp
      NODE_ENV: production
    volumes:
      - printdrop_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16
    container_name: printdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printdrop}
      POSTGRES_USER: ${POSTGRES_USER:-printdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - printdrop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printdrop} -d ${POSTGRES_DB:-printdrop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  printdrop_data:
  printdrop_postgres:
