[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printdrop"
version = "0.1.0"
description = "Self-hosted print job management for CUPS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PrintDrop Maintainers" }]
dependencies = [
  "alembic==1.13.2",
  "apscheduler==3.10.4",
  "fastapi==0.141.1",
  "gunicorn==23.0.0",
  "jinja2==3.1.6",
  "orjson==3.11.9",
  "passlib[argon2]==1.7.4",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pypdf==6.14.2",
  "python-magic==0.4.27",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.34",
  "starlette==1.3.1",
  "psycopg[binary]==3.2.1",
  "tzdata==2024.1",
  "uvicorn[standard]==0.52.0",
  "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "httpx==0.27.0",
  "mypy==1.11.2",
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "ruff==0.6.2",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "W"]
ignore = ["S104", "S105", "S603", "S607", "S101", "B008", "E501", "I001", "UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
pretty = true

[tool.setuptools.packages.find]
include = ["app*"]
