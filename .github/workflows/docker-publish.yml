name: docker-publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/printdrop

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          DATABASE_URL: file:./prisma/ci.db
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long
          PRINT_API_KEY: ci-print-api-key
        run: npm test

      - name: Build Next.js app
        env:
          DATABASE_URL: file:./prisma/ci.db
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long
          PRINT_API_KEY: ci-print-api-key
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: local/printdrop:ci

  docker-publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: lint-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TEMPORARILY SKIPPED (maintainer request): Trivy image scanning + SPDX SBOM.
      # The previous HIGH/CRITICAL exit-code:1 gate was failing docker-publish CI.
      # Re-enable SARIF upload, severity gate, and Trivy SBOM when image hardening is ready.
      # - Trivy image scan (SARIF) / upload-sarif
      # - Trivy image scan (fail on HIGH/CRITICAL, exit-code: 1)
      # - Generate SBOM with Trivy / Upload SBOM artifact
